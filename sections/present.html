<section class="phase phase-present" id="present" hidden>
  <button class="gift" id="gift" type="button" aria-label="هدية تهرب منكِ، امسكيها">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="giftRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dc92bb"/><stop offset="1" stop-color="#a5608c"/></linearGradient>
        <linearGradient id="giftGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc90"/><stop offset="1" stop-color="#c6942e"/></linearGradient>
      </defs>
      <rect x="36" y="98" width="128" height="86" rx="14" fill="url(#giftRose)"/>
      <rect x="88" y="98" width="24" height="86" fill="url(#giftGold)"/>
      <g id="lid">
        <rect x="24" y="72" width="152" height="34" rx="9" fill="url(#giftGold)"/>
        <rect x="88" y="72" width="24" height="34" fill="#e2b64f"/>
        <ellipse cx="74" cy="52" rx="24" ry="15" fill="url(#giftGold)" transform="rotate(-28 74 52)"/>
        <ellipse cx="126" cy="52" rx="24" ry="15" fill="url(#giftGold)" transform="rotate(28 126 52)"/>
        <circle cx="100" cy="62" r="10" fill="#f6da8c" stroke="#c8962f" stroke-width="2"/>
      </g>
    </svg>
  </button>
  <div class="present-copy">
    <p class="kicker">شيء صغير لكِ</p>
    <h1 class="title-ar">مستعدّة لهديتكِ يا مروة؟</h1>
    <p class="title-en" lang="en" dir="ltr">are you ready for your present, marwa?</p>
    <p class="gift-label" id="giftLabel">
      <span class="ar">امسكيني إن استطعتِ 🎁</span>
      <span class="en" lang="en" dir="ltr">catch me if you can</span>
    </p>
  </div>
</section>
