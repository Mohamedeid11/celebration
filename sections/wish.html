<section class="phase phase-wish" id="wish" hidden>
  <h2 class="title-ar">تمنّي أمنية 🕯️</h2>
  <p class="title-en" lang="en" dir="ltr">make a wish</p>
  <div class="cake" aria-hidden="true">
    <div class="candles" id="candles"></div>
    <div class="tier tier-top"></div>
    <div class="tier tier-bottom"></div>
    <div class="plate"></div>
  </div>
  <p class="hint" id="wishHint">
    <span class="ar">اضغطي مطوّلاً على الزر لتنفخي، أو دعي الميكروفون يسمع نفَسكِ</span>
    <span class="en" lang="en" dir="ltr">hold the button to blow, or let your mic feel the breeze</span>
  </p>
  <div class="actions">
    <button type="button" class="btn btn-gold" id="blowHold"><span class="ar">💨 اضغطي وانفخي</span><span class="en" lang="en" dir="ltr">hold to blow</span></button>
    <button type="button" class="btn btn-ghost" id="blowMic"><span class="ar">🎤 انفخي بجدّ</span><span class="en" lang="en" dir="ltr">blow for real</span></button>
  </div>
</section>
